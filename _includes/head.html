<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030603">
  <script>
    /* Set the theme before first paint: saved choice, else the system setting, else dark. */
    (function () {
      var d = document.documentElement, t;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      d.setAttribute('data-theme', t);
      d.classList.add('js');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'light' ? '#ffffff' : '#030603');
    })();
  </script>

  {% seo %}
  {% feed_meta %}

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  {% if page.layout == 'post' %}
  <script src="{{ '/js/highlightjs/highlight.min.js' | relative_url }}"></script>
  <script src="{{ '/js/highlightjs/languages/plaintext.min.js' | relative_url }}"></script>
  <script src="{{ '/js/highlightjs/languages/powershell.min.js' | relative_url }}"></script>

  <script>document.addEventListener('DOMContentLoaded', function () { hljs.highlightAll(); });</script>
  {% endif %}
</head>
