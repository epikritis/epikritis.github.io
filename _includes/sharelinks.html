{%- assign safeurl = page.url | absolute_url | url_encode -%}
{%- assign safetitle = page.title | url_encode -%}
<div class="share">
  <span class="muted mono">share:</span>
  <a href="https://www.linkedin.com/sharing/share-offsite/?url={{ safeurl }}" target="_blank" rel="noopener" aria-label="Share on LinkedIn">{% include icons.html name='linkedin' %}</a>
  <a href="mailto:?subject={{ safetitle }}&amp;body={{ safeurl }}" aria-label="Share by email">{% include icons.html name='mail' %}</a>
  <button type="button" class="copy-link" data-url="{{ page.url | absolute_url }}" aria-label="Copy link">copy link</button>
</div>
