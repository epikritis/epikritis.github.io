<footer class="site-footer">
  <div class="container footer-inner">
    <p class="mono">&copy; {{ site.time | date: '%Y' }} {{ site.author }} &middot; <span class="muted">secured by curiosity</span></p>
    <ul class="social">
      <li><a href="{{ site.linkedin_url }}" target="_blank" rel="noopener" aria-label="LinkedIn">{% include icons.html name='linkedin' %}</a></li>
      <li><a href="{{ site.github_url }}" target="_blank" rel="noopener" aria-label="GitHub">{% include icons.html name='github' %}</a></li>
      <li><a href="{{ site.blog_url }}" target="_blank" rel="noopener" aria-label="Blog">{% include icons.html name='pen' %}</a></li>
    </ul>
  </div>
</footer>
